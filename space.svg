<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030510" />
      <stop offset="40%" stop-color="#081426" />
      <stop offset="100%" stop-color="#020208" />
    </linearGradient>
    <radialGradient id="nebula1">
      <stop offset="0%" stop-color="#7b5cff" stop-opacity=".35" />
      <stop offset="100%" stop-color="#7b5cff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula2">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity=".25" />
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <g id="cross-flare">
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#ffffff" stroke-width="0.6" opacity="0.8" />
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#ffffff" stroke-width="0.6" opacity="0.8" />
      <line x1="-3" y1="-3" x2="3" y2="3" stroke="#ffffff" stroke-width="0.3" opacity="0.5" />
      <line x1="-3" y1="3" x2="3" y2="-3" stroke="#ffffff" stroke-width="0.3" opacity="0.5" />
    </g>

    <linearGradient id="meteorTail1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="20%" stop-color="#9fe9ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9fe9ff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />

  <circle cx="300" cy="120" r="170" fill="url(#nebula1)">
    <animate attributeName="opacity" values=".2;.5;.2" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle cx="900" cy="170" r="180" fill="url(#nebula2)">
    <animate attributeName="opacity" values=".3;.15;.3" dur="9s" repeatCount="indefinite" />
  </circle>

  <g fill="white" filter="url(#glow)">
    <g transform="translate(80,60)">
      <circle cx="0" cy="0" r="1.5" />
      <use transform="matrix(null,null,null,null,null,null)" href="#cross-flare" />
      <animate attributeName="opacity" values="1;0.2;1;0.5;1" dur="0.4s" repeatCount="indefinite" />
    </g>

    <g transform="translate(250,90)">
      <circle cx="0" cy="0" r="1.2" />
      <use transform="matrix(null,null,null,null,null,null)" href="#cross-flare" />
      <animate attributeName="opacity" values="0.3;1;0.3;0.8;0.3" dur="0.6s" repeatCount="indefinite" />
    </g>

    <g transform="translate(420,40)">
      <circle cx="0" cy="0" r="1.5" />
      <use transform="matrix(null,null,null,null,null,null)" href="#cross-flare" />
      <animate attributeName="opacity" values="1;0.4;1;0.2;1" dur="0.35s" repeatCount="indefinite" />
    </g>

    <g transform="translate(650,150)">
      <circle cx="0" cy="0" r="1.5" />
      <use transform="matrix(null,null,null,null,null,null)" href="#cross-flare" />
      <animate attributeName="opacity" values="0.8;0.1;0.8;1;0.8" dur="0.5s" repeatCount="indefinite" />
    </g>

    <g transform="translate(920,80)">
      <circle cx="0" cy="0" r="1.8" />
      <use transform="matrix(null,null,null,null,null,null)" href="#cross-flare" />
      <animate attributeName="opacity" values="1;0.3;1;0.6;1" dur="0.45s" repeatCount="indefinite" />
    </g>

    <g transform="translate(1080,200)">
      <circle cx="0" cy="0" r="1" />
      <use transform="matrix(null,null,null,null,null,null)" href="#cross-flare" />
      <animate attributeName="opacity" values="0.2;1;0.2;0.5;0.2" dur="0.7s" repeatCount="indefinite" />
    </g>
  </g>

  <g fill="#ffffff">
    <circle cx="120" cy="210" r=".8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="170" cy="170" r=".9" />
    <circle cx="220" cy="40" r=".8">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="0.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="320" cy="240" r=".8" />
    <circle cx="370" cy="150" r=".8" />
    <circle cx="470" cy="200" r=".8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="520" cy="80" r=".8" />
    <circle cx="610" cy="35" r=".8" />
    <circle cx="720" cy="110" r=".8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="770" cy="230" r=".8" />
    <circle cx="860" cy="45" r=".8" />
    <circle cx="980" cy="140" r=".8">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="1140" cy="70" r=".8" />
  </g>

  <g filter="url(#glow)">
    <g transform="translate(950,-13)">
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
      <line x1="0" y1="0" x2="80" y2="-40" stroke="url(#meteorTail1)" stroke-width="2" stroke-linecap="round" />

      <animateTransform attributeName="transform" type="translate" values="950,-13; -240,510" dur="0.4s" repeatCount="1"
        begin="3s" />
    </g>
  </g>
</svg>
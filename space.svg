<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 300"
     width="1200"
     height="300">
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#030510"/>
<stop offset="40%" stop-color="#081426"/>
<stop offset="100%" stop-color="#020208"/>
</linearGradient>
<radialGradient id="nebula1">
<stop offset="0%" stop-color="#7b5cff" stop-opacity=".35"/>
<stop offset="100%" stop-color="#7b5cff" stop-opacity="0"/>
</radialGradient>
<radialGradient id="nebula2">
<stop offset="0%" stop-color="#00d4ff" stop-opacity=".25"/>
<stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
</radialGradient>
<filter id="glow">
<feGaussianBlur stdDeviation="3" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<circle cx="300" cy="120" r="170" fill="url(#nebula1)">
<animate attributeName="opacity"
values=".2;.5;.2"
dur="12s"
repeatCount="indefinite"/>
</circle>
<circle cx="900" cy="170" r="180" fill="url(#nebula2)">
<animate attributeName="opacity"
values=".3;.15;.3"
dur="9s"
repeatCount="indefinite"/>
</circle>
<g fill="white" filter="url(#glow)">
<circle cx="80" cy="60" r="2">
<animate attributeName="opacity"
values="1;.2;1"
dur="1.4s"
repeatCount="indefinite"/>
</circle>
<circle cx="250" cy="90" r="2">
<animate attributeName="opacity"
values=".2;1;.2"
dur="2.1s"
repeatCount="indefinite"/>
</circle>
<circle cx="420" cy="40" r="2">
<animate attributeName="r"
values="1.5;3;1.5"
dur="2s"
repeatCount="indefinite"/>
</circle>
<circle cx="650" cy="150" r="2">
<animate attributeName="opacity"
values="1;.3;1"
dur="1.8s"
repeatCount="indefinite"/>
</circle>
<circle cx="920" cy="80" r="2">
<animate attributeName="r"
values="2;4;2"
dur="2.5s"
repeatCount="indefinite"/>
</circle>
<circle cx="1080" cy="200" r="2">
<animate attributeName="opacity"
values=".2;1;.2"
dur="1.6s"
repeatCount="indefinite"/>
</circle>
</g>
<g fill="#ffffff">
<circle cx="120" cy="210" r=".8"/>
<circle cx="170" cy="170" r=".9"/>
<circle cx="220" cy="40" r=".8"/>
<circle cx="320" cy="240" r=".8"/>
<circle cx="370" cy="150" r=".8"/>
<circle cx="470" cy="200" r=".8"/>
<circle cx="520" cy="80" r=".8"/>
<circle cx="610" cy="35" r=".8"/>
<circle cx="720" cy="110" r=".8"/>
<circle cx="770" cy="230" r=".8"/>
<circle cx="860" cy="45" r=".8"/>
<circle cx="980" cy="140" r=".8"/>
<circle cx="1140" cy="70" r=".8"/>
</g>
<g opacity="0">
<line x1="0" y1="0"
x2="70" y2="0"
stroke="white"
stroke-width="2"
stroke-linecap="round"
filter="url(#glow)"/>
<animateTransform
attributeName="transform"
type="translate"
values="-150 20;
500 180;
1200 330"
dur="3.5s"
repeatCount="indefinite"/>
<animate
attributeName="opacity"
values="0;1;1;0"
dur="3.5s"
repeatCount="indefinite"/>
</g>
<g opacity="0">
<line x1="0" y1="0"
x2="50" y2="0"
stroke="#9fe9ff"
stroke-width="1.5"
stroke-linecap="round"
filter="url(#glow)"/>
<animateTransform
attributeName="transform"
type="translate"
values="900 -40;
1300 160"
dur="5s"
begin="2s"
repeatCount="indefinite"/>
<animate
attributeName="opacity"
values="0;1;1;0"
dur="5s"
begin="2s"
repeatCount="indefinite"/>
</g>
<g transform="translate(1040 60)" filter="url(#glow)">
<line x1="-8" y1="0" x2="8" y2="0" stroke="white"/>
<line x1="0" y1="-8" x2="0" y2="8" stroke="white"/>
<animateTransform
attributeName="transform"
type="scale"
values="1;1.8;1"
dur="2s"
repeatCount="indefinite"/>
</g>
</svg>